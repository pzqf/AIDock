name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal schemas web)"
      - run: go vet ./...
      - run: go test -race -count=1 -timeout 20m ./...
      - run: go build ./cmd/aidock
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-web.cjs
      - run: node demo/tests/regression.cjs
