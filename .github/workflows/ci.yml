name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal schemas web)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/aidock
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check web/assets/app.js
      - run: node --check web/assets/source.js
      - run: node --check web/assets/projects-view.js
      - run: node --check web/assets/native-view.js
      - run: node --check web/assets/native-write.js
      - run: node --check web/assets/replica-view.js
      - run: node --check web/assets/replica-checks.js
      - run: node --check web/assets/isolation-view.js
      - run: node --check web/assets/generator-view.js
      - run: node --check web/assets/native-rehearsal.js
      - run: node --check web/assets/bridge-view.js
      - run: node --check web/assets/bridge-console.js
      - run: node web/tests/state.cjs
      - run: node web/tests/source-state.cjs
      - run: node web/tests/projects-state.cjs
      - run: node web/tests/project-bootstrap.cjs
      - run: node web/tests/native-state.cjs
      - run: node web/tests/native-write-state.cjs
      - run: node web/tests/replica-state.cjs
      - run: node web/tests/replica-check-state.cjs
      - run: node web/tests/isolation-state.cjs
      - run: node web/tests/generator-state.cjs
      - run: node web/tests/rehearsal-state.cjs
      - run: node web/tests/bridge-state.cjs
      - run: node demo/tests/regression.cjs
